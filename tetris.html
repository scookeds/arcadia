<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Block Drop — Arcadia</title>
<style>
  :root{--bg:#0b0f1a;--card:#131824;--grid:#1e2636;--primary:#3b82f6;--accent:#8b5cf6;--text:#f8fafc;--muted:#94a3b8}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:radial-gradient(circle at 50% 0%,#131a2c,var(--bg));min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Poppins',system-ui,sans-serif;color:var(--text);padding:16px;gap:12px;user-select:none}
  h1{font-size:1.8rem;font-weight:800;letter-spacing:1px;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
  .wrap{display:flex;gap:16px;align-items:flex-start}
  canvas{background:var(--card);border:1px solid var(--grid);border-radius:12px}
  .side{display:flex;flex-direction:column;gap:12px}
  .box{background:var(--card);border:1px solid var(--grid);border-radius:12px;padding:12px;text-align:center;min-width:96px}
  .box .lbl{font-size:.65rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
  .box .val{font-size:1.4rem;font-weight:800}
  button{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;border:none;border-radius:10px;padding:10px;font-weight:700;font-family:inherit;cursor:pointer;width:100%}
  button:active{transform:scale(.96)}
  .ctrls{display:none;gap:8px}
  .ctrls button{font-size:1.2rem;padding:14px 0}
  .hint{color:var(--muted);font-size:.8rem;text-align:center;max-width:280px}
  @media(max-width:640px){.ctrls{display:grid;grid-template-columns:repeat(4,1fr);width:min(320px,92vw)}}
</style>
</head>
<body>
  <h1>Block Drop</h1>
  <div class="wrap">
    <canvas id="c" width="240" height="440"></canvas>
    <div class="side">
      <div class="box"><div class="lbl">Score</div><div class="val" id="score">0</div></div>
      <div class="box"><div class="lbl">Lines</div><div class="val" id="lines">0</div></div>
      <div class="box"><div class="lbl">Next</div><canvas id="next" width="72" height="72" style="margin-top:6px"></canvas></div>
      <button id="restart">New Game</button>
    </div>
  </div>
  <div class="ctrls">
    <button id="bl">◀</button><button id="br">▶</button><button id="bd">▼</button><button id="bu">⟳</button>
  </div>
  <div class="hint">← → move · ↑ rotate · ↓ soft drop · space hard drop</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');const nx=document.getElementById('next'),nctx=nx.getContext('2d');
const COLS=10,ROWS=22,S=cv.width/COLS;
const SHAPES={I:[[1,1,1,1]],O:[[1,1],[1,1]],T:[[0,1,0],[1,1,1]],S:[[0,1,1],[1,1,0]],Z:[[1,1,0],[0,1,1]],J:[[1,0,0],[1,1,1]],L:[[0,0,1],[1,1,1]]};
const COL={I:'#38bdf8',O:'#f59e0b',T:'#8b5cf6',S:'#22c55e',Z:'#ef4444',J:'#3b82f6',L:'#f97316'};
let board,cur,next,px,py,score,lines,drop,last,over;
function rnd(){const k=Object.keys(SHAPES);const t=k[Math.floor(Math.random()*k.length)];return{t,m:SHAPES[t].map(r=>[...r])};}
function init(){board=Array.from({length:ROWS},()=>Array(COLS).fill(0));cur=rnd();next=rnd();spawn(true);score=0;lines=0;over=false;drop=650;last=0;upd();requestAnimationFrame(tick);}
function spawn(first){if(!first)cur=next,next=rnd();px=Math.floor((COLS-cur.m[0].length)/2);py=0;if(collide(px,py,cur.m))over=true;drawNext();}
function collide(x,y,m){for(let r=0;r<m.length;r++)for(let c=0;c<m[r].length;c++){if(!m[r][c])continue;const nxp=x+c,nyp=y+r;if(nxp<0||nxp>=COLS||nyp>=ROWS)return true;if(nyp>=0&&board[nyp][nxp])return true;}return false;}
function merge(){cur.m.forEach((row,r)=>row.forEach((v,c)=>{if(v&&py+r>=0)board[py+r][px+c]=cur.t;}));}
function clear(){let n=0;for(let r=ROWS-1;r>=0;r--){if(board[r].every(v=>v)){board.splice(r,1);board.unshift(Array(COLS).fill(0));n++;r++;}}if(n){lines+=n;score+=[0,100,300,500,800][n];drop=Math.max(120,650-lines*18);}}
function rotate(){const m=cur.m,R=m[0].map((_,i)=>m.map(r=>r[i]).reverse());if(!collide(px,py,R))cur.m=R;else if(!collide(px-1,py,R)){px--;cur.m=R;}else if(!collide(px+1,py,R)){px++;cur.m=R;}}
function step(){if(!collide(px,py+1,cur.m)){py++;}else{merge();clear();spawn(false);}upd();}
function hard(){while(!collide(px,py+1,cur.m))py++;step();}
function tick(t){if(over){banner();return;}if(t-last>drop){step();last=t;}draw();requestAnimationFrame(tick);}
function cell(x,y,color){ctx.fillStyle=color;ctx.fillRect(x*S+1,y*S+1,S-2,S-2);ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(x*S+1,y*S+1,S-2,4);}
function draw(){ctx.clearRect(0,0,cv.width,cv.height);for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(board[r][c])cell(c,r,COL[board[r][c]]);cur.m.forEach((row,r)=>row.forEach((v,c)=>{if(v&&py+r>=0)cell(px+c,py+r,COL[cur.t]);}));}
function drawNext(){nctx.clearRect(0,0,72,72);const m=next.m,s=16,ox=(72-m[0].length*s)/2,oy=(72-m.length*s)/2;m.forEach((row,r)=>row.forEach((v,c)=>{if(v){nctx.fillStyle=COL[next.t];nctx.fillRect(ox+c*s+1,oy+r*s+1,s-2,s-2);}}));}
function banner(){ctx.fillStyle='rgba(11,15,26,.82)';ctx.fillRect(0,0,cv.width,cv.height);ctx.fillStyle='#f8fafc';ctx.font='700 26px Poppins,sans-serif';ctx.textAlign='center';ctx.fillText('Game Over',cv.width/2,cv.height/2);}
function upd(){document.getElementById('score').textContent=score;document.getElementById('lines').textContent=lines;}
addEventListener('keydown',e=>{if(over)return;if(['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'&&!collide(px-1,py,cur.m))px--;else if(e.key==='ArrowRight'&&!collide(px+1,py,cur.m))px++;else if(e.key==='ArrowDown')step();else if(e.key==='ArrowUp')rotate();else if(e.key===' ')hard();draw();});
document.getElementById('bl').onclick=()=>{if(!over&&!collide(px-1,py,cur.m)){px--;draw();}};
document.getElementById('br').onclick=()=>{if(!over&&!collide(px+1,py,cur.m)){px++;draw();}};
document.getElementById('bd').onclick=()=>{if(!over){step();draw();}};
document.getElementById('bu').onclick=()=>{if(!over){rotate();draw();}};
document.getElementById('restart').onclick=init;
init();
</script>
</body>
</html>
