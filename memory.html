<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Memory Match — Arcadia</title>
<style>
  :root{--bg:#0b0f1a;--card:#131824;--grid:#1e2636;--primary:#3b82f6;--accent:#8b5cf6;--text:#f8fafc;--muted:#94a3b8}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:radial-gradient(circle at 50% 0%,#131a2c,var(--bg));min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Poppins',system-ui,sans-serif;color:var(--text);padding:16px;gap:14px;user-select:none}
  h1{font-size:2rem;font-weight:800;letter-spacing:1px;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hud{display:flex;gap:12px;width:min(420px,92vw);justify-content:space-between;align-items:center}
  .score{background:var(--card);border:1px solid var(--grid);border-radius:12px;padding:8px 16px;font-weight:700}
  .score span{color:var(--muted);font-weight:500;font-size:.8rem}
  button{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;border:none;border-radius:12px;padding:10px 18px;font-weight:700;font-family:inherit;cursor:pointer}
  button:active{transform:scale(.96)}
  #grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(420px,92vw)}
  .tile{aspect-ratio:1;border-radius:12px;position:relative;cursor:pointer;transform-style:preserve-3d;transition:transform .35s}
  .tile.flip,.tile.done{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:2rem;backface-visibility:hidden}
  .back{background:var(--card);border:1px solid var(--grid)}
  .back::after{content:'';width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--primary),var(--accent))}
  .front{background:var(--grid);border:2px solid var(--primary);transform:rotateY(180deg)}
  .tile.done .front{border-color:var(--accent);opacity:.55}
  .win{color:var(--accent);font-weight:700;height:22px}
</style>
</head>
<body>
  <h1>Memory Match</h1>
  <div class="hud">
    <div class="score">Moves <span id="moves">0</span></div>
    <div class="score">Pairs <span id="pairs">0/8</span></div>
    <button id="restart">New Game</button>
  </div>
  <div id="grid"></div>
  <div class="win" id="win"></div>
<script>
const ICONS=['🚀','🎮','⭐','🔥','💎','🎯','⚡','🌙'];
const grid=document.getElementById('grid');let first,lock,moves,matched;
function init(){grid.innerHTML='';first=null;lock=false;moves=0;matched=0;upd();document.getElementById('win').textContent='';
  const deck=[...ICONS,...ICONS].map(v=>({v,r:Math.random()})).sort((a,b)=>a.r-b.r);
  deck.forEach(d=>{const t=document.createElement('div');t.className='tile';t.dataset.v=d.v;t.innerHTML=`<div class="face back"></div><div class="face front">${d.v}</div>`;t.onclick=()=>flip(t);grid.appendChild(t);});}
function flip(t){if(lock||t.classList.contains('flip')||t.classList.contains('done'))return;t.classList.add('flip');if(!first){first=t;return;}moves++;upd();if(first.dataset.v===t.dataset.v){first.classList.add('done');t.classList.add('done');first=null;matched++;upd();if(matched===ICONS.length)document.getElementById('win').textContent=`Solved in ${moves} moves! 🎉`;}
  else{lock=true;const a=first;first=null;setTimeout(()=>{a.classList.remove('flip');t.classList.remove('flip');lock=false;},700);}}
function upd(){document.getElementById('moves').textContent=moves;document.getElementById('pairs').textContent=matched+'/8';}
document.getElementById('restart').onclick=init;
init();
</script>
</body>
</html>
