<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neon Snake — Arcadia</title>
<style>
  :root{--bg:#0b0f1a;--card:#131824;--grid:#1e2636;--primary:#3b82f6;--accent:#8b5cf6;--text:#f8fafc;--muted:#94a3b8}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:radial-gradient(circle at 50% 0%,#131a2c,var(--bg));min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Poppins',system-ui,sans-serif;color:var(--text);padding:16px;gap:14px;user-select:none}
  h1{font-size:2rem;font-weight:800;letter-spacing:1px;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hud{display:flex;gap:12px;width:min(440px,92vw);justify-content:space-between;align-items:center}
  .score{background:var(--card);border:1px solid var(--grid);border-radius:12px;padding:8px 16px;font-weight:700}
  .score span{color:var(--muted);font-weight:500;font-size:.8rem}
  button{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;border:none;border-radius:12px;padding:10px 18px;font-weight:700;font-family:inherit;cursor:pointer}
  button:active{transform:scale(.96)}
  canvas{background:var(--card);border:1px solid var(--grid);border-radius:16px;width:min(440px,92vw);height:auto;touch-action:none}
  .hint{color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
  <h1>Neon Snake</h1>
  <div class="hud">
    <div class="score">Score <span id="score">0</span></div>
    <div class="score">Best <span id="best">0</span></div>
    <button id="restart">Restart</button>
  </div>
  <canvas id="c" width="400" height="400"></canvas>
  <div class="hint">Arrow keys / WASD or swipe</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');const N=20,S=cv.width/N;
let snake,dir,nextDir,food,score,best=+(localStorage.getItem('arcSnakeBest')||0),loop,speed,dead;
document.getElementById('best').textContent=best;
function init(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};nextDir=dir;score=0;speed=110;dead=false;place();document.getElementById('score').textContent=0;clearInterval(loop);loop=setInterval(tick,speed);}
function place(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)};}while(snake.some(s=>s.x===food.x&&s.y===food.y));}
function tick(){dir=nextDir;const h={x:(snake[0].x+dir.x+N)%N,y:(snake[0].y+dir.y+N)%N};if(snake.some(s=>s.x===h.x&&s.y===h.y)){return end();}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;document.getElementById('score').textContent=score;place();if(speed>55){speed-=3;clearInterval(loop);loop=setInterval(tick,speed);}}else{snake.pop();}draw();}
function draw(){ctx.clearRect(0,0,cv.width,cv.height);ctx.fillStyle='#8b5cf6';ctx.shadowColor='#8b5cf6';ctx.shadowBlur=14;ctx.beginPath();ctx.roundRect(food.x*S+3,food.y*S+3,S-6,S-6,5);ctx.fill();snake.forEach((s,i)=>{const t=i/snake.length;ctx.fillStyle=i===0?'#60a5fa':`rgb(${59+t*40},${130-t*40},${246-t*60})`;ctx.shadowColor='#3b82f6';ctx.shadowBlur=i===0?16:6;ctx.beginPath();ctx.roundRect(s.x*S+2,s.y*S+2,S-4,S-4,5);ctx.fill();});ctx.shadowBlur=0;}
function end(){dead=true;clearInterval(loop);if(score>best){best=score;localStorage.setItem('arcSnakeBest',best);document.getElementById('best').textContent=best;}ctx.fillStyle='rgba(11,15,26,.8)';ctx.fillRect(0,0,cv.width,cv.height);ctx.fillStyle='#f8fafc';ctx.font='700 30px Poppins,sans-serif';ctx.textAlign='center';ctx.fillText('Game Over',cv.width/2,cv.height/2-6);ctx.font='16px Poppins,sans-serif';ctx.fillStyle='#94a3b8';ctx.fillText('Score: '+score,cv.width/2,cv.height/2+24);}
function turn(x,y){if(dir.x===-x&&dir.y===-y)return;nextDir={x,y};}
addEventListener('keydown',e=>{const m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1],a:[-1,0],d:[1,0],w:[0,-1],s:[0,1]}[e.key];if(m){e.preventDefault();turn(m[0],m[1]);}});
let sx,sy;cv.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
cv.addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>Math.abs(dy)){if(Math.abs(dx)>20)turn(dx>0?1:-1,0);}else{if(Math.abs(dy)>20)turn(0,dy>0?1:-1);}sx=sy=null;},{passive:true});
document.getElementById('restart').onclick=init;
if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);return this;};}
init();
</script>
</body>
</html>
